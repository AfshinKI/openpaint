name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  repository:
    name: Documentation and privacy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate repository
        run: python3 tools/check_repo.py
      - name: Test validation tooling
        run: python3 -m unittest discover -s tools/tests -v

  native:
    name: Native shell (${{ matrix.compiler }}, ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++-13
            preset: dev
          - compiler: clang++-18
            preset: release
          - compiler: clang++-18
            preset: asan
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 clang-18 ninja-build python3-venv \
            zlib1g-dev libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0 xvfb xauth
      - name: Install pinned development tools and Qt
        run: |
          python3 -m venv build/tooling
          build/tooling/bin/python -m pip install -r tools/requirements-dev.txt
          build/tooling/bin/python -m aqt install-qt linux desktop 6.12.0 linux_gcc_64 \
            --outputdir build/qt --modules qtimageformats --archives icu qtbase qtdeclarative qtsvg qttools qtwayland qtimageformats
          echo "$GITHUB_WORKSPACE/build/tooling/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/build/qt/6.12.0/gcc_64" >> "$GITHUB_ENV"
      - name: Configure and build
        run: |
          cmake --preset "${{ matrix.preset }}"
          cmake --build --preset "${{ matrix.preset }}" --parallel 2
      - name: Check C++ and QML
        run: cmake --build --preset "${{ matrix.preset }}" --target format-check qml-lint
      - name: Test application shell
        run: ctest --preset "${{ matrix.preset }}"
      - name: Test isolated X11 input and scaling
        if: matrix.preset == 'dev'
        run: |
          ldd "$CMAKE_PREFIX_PATH/plugins/platforms/libqxcb.so"
          for scale in 1 1.25 1.5 2; do
            QT_SCALE_FACTOR="$scale" xvfb-run -a -s '-screen 0 3200x2000x24 -nolisten tcp' \
              env QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software ./build/dev/openpaint_shell_tests
          done

  appimage:
    name: AppImage package and inventory
    env:
      CXX: g++-13
    runs-on: ubuntu-24.04
    container:
      image: ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
    timeout-minutes: 25
    steps:
      - name: Install Git before checkout
        run: |
          apt-get update
          apt-get install -y git ca-certificates
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install package prerequisites and source indexes
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y g++-13 cmake ninja-build python3-venv zlib1g-dev \
            ca-certificates file git \
            libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0 desktop-file-utils appstream \
            libdbus-1-3 libegl1 libfontconfig1 libfreetype6 libglib2.0-0t64 \
            libx11-6 libxext6 libxrender1 libwayland-client0 libwayland-egl1 \
            libwayland-cursor0 libvulkan1 libdrm2
      - name: Install pinned Qt
        run: |
          python3 -m venv build/tooling
          build/tooling/bin/python -m pip install -r tools/requirements-dev.txt
          build/tooling/bin/python -m aqt install-qt linux desktop 6.12.0 linux_gcc_64 \
            --outputdir build/qt --modules qtimageformats --archives icu qtbase qtdeclarative qtsvg qttools qtwayland qtimageformats
      - name: Build portable package, source bundle and inventory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --verify HEAD
          desktop-file-validate packaging/io.github.AfshinKI.OpenPaint.desktop
          appstreamcli validate --no-net packaging/io.github.AfshinKI.OpenPaint.metainfo.xml
          python3 tools/package_appimage.py --qt build/qt/6.12.0/gcc_64 --collect-system-sources --kind portable --suffix "alpha.${GITHUB_RUN_NUMBER}"
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 build/appimage/*.AppImage --version
          mkdir -p build/portable-smoke
          tar -xzf build/appimage/public/*-linux-x86_64.tar.gz -C build/portable-smoke
          QT_QPA_PLATFORM=offscreen build/portable-smoke/*/openpaint --version
          cd build/appimage/public
          sha256sum -c SHA256SUMS
      - name: Retain review artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-development-x86_64
          retention-days: 7
          if-no-files-found: error
          path: |
            build/appimage/public/*
            build/appimage/*.AppImage
            build/appimage/*.json
            build/appimage/*.tar
            build/appimage/SHA256SUMS

  flatpak:
    name: Flatpak bundle and sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Flatpak build tools and reviewed runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          python3 - <<'PY'
          import json, subprocess
          lock = json.load(open('packaging/flatpak-runtime.json'))
          for kind in ('runtime', 'sdk'):
              entry = lock[kind]
              ref = f"{entry['id']}/{lock['architecture']}/{lock['branch']}"
              subprocess.run(['flatpak', 'install', '--user', '-y', '--noninteractive', 'flathub', ref], check=True)
              subprocess.run(['flatpak', 'update', '--user', '-y', '--noninteractive', '--commit=' + entry['commit'], ref], check=True)
          PY
      - name: Build and inspect sandboxed package
        run: |
          python3 tools/package_flatpak.py
          flatpak install --user -y --noninteractive build/flatpak/*.flatpak
          flatpak run --env=QT_QPA_PLATFORM=offscreen io.github.AfshinKI.OpenPaint --version
          cd build/flatpak
          sha256sum -c SHA256SUMS
      - name: Retain review artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-development-x86_64
          retention-days: 7
          if-no-files-found: error
          path: |
            build/flatpak/*.flatpak
            build/flatpak/*.json
            build/flatpak/openpaint-source.tar
            build/flatpak/SHA256SUMS

  publish:
    name: Publish tested alpha
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [repository, native, appimage, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Download this run's tested packages
        run: gh run download "$RUN_ID" --name appimage-development-x86_64 --dir artifacts
      - name: Publish immutable alpha assets
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/public
          sha256sum -c SHA256SUMS
          archive=(OpenPaint-*-linux-x86_64.tar.gz)
          test "${#archive[@]}" -eq 1
          version="${archive[0]#OpenPaint-}"
          version="${version%-linux-x86_64.tar.gz}"
          tag="v${version}"
          cat > notes.md <<'NOTES'
          Linux x86_64 alpha (Ubuntu 24.04 or newer compatible desktop).

          **Download the `linux-x86_64.tar.gz` archive**, extract it, then run `openpaint` inside the extracted folder. Keep the entire folder together. No installation, administrator access, FUSE, or AppImage runtime is required.

          `sources-and-notices.tar` is for developers and license compliance, not installation. `SHA256SUMS` verifies downloads. Automatic in-app updating is not implemented; close the app and extract a newer archive to update. Alpha software: keep copies of important drawings.
          NOTES
          # Draft first: a failed upload never leaves a partial published release.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_SHA" --draft --prerelease --title "OpenPaint $version" --notes-file notes.md
          fi
          if test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true; then
            gh release upload "$tag" "${archive[0]}" OpenPaint-*-sources-and-notices.tar SHA256SUMS --clobber
            gh release edit "$tag" --draft=false --prerelease --latest=false
          fi
