name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Stable version matching CMake (for example 1.0.0); blank validates only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  identity:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
      macos:
    name: macOS arm64 bundle and native tests
    needs: identity
    runs-on: macos-15
    timeout-minutes: 35
    env:
      VERSION_SUFFIX: ${{ needs.identity.outputs.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Qt and development tools
        run: |
          python3 -m venv build/tooling
          build/tooling/bin/python -m pip install -r tools/requirements-dev.txt cmake==3.30.5 ninja==1.11.1.1
          build/tooling/bin/python -m aqt install-qt mac desktop 6.12.0 clang_64 --outputdir build/qt --modules qtimageformats --archives qtbase qtdeclarative qtsvg qttools qtimageformats
          echo "$GITHUB_WORKSPACE/build/tooling/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/build/qt/6.12.0/macos" >> "$GITHUB_ENV"
      - name: Build macOS application
        run: |
          cmake --preset release -DOPENPAINT_INSTALL_KIND=macos -DOPENPAINT_VERSION_SUFFIX="$VERSION_SUFFIX" -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.4 -DLibArchive_INCLUDE_DIR="$(xcrun --show-sdk-path)/usr/include" -DLibArchive_LIBRARY="$(xcrun --show-sdk-path)/usr/lib/libarchive.tbd"
          cmake --build --preset release --parallel 3
          cmake --build --preset release --target format-check qml-lint
      - name: Run editor and Cocoa tests
        run: |
          ctest --preset release
          QT_QPA_PLATFORM=cocoa QSG_RHI_BACKEND=metal build/release/openpaint_shell_tests interruptedStrokeAndRightPan layersWorkflow keyboardFileWorkflow
      - name: Package and audit macOS disk image
        run: python3 tools/package_macos.py --qt "$CMAKE_PREFIX_PATH" --version "${{ needs.identity.outputs.version }}"
      - name: Retain macOS release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-development-arm64
          retention-days: 7
          if-no-files-found: error
          path: build/macos/public/*

  publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 tools/release.py identity

  repository:
    name: Documentation and privacy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate repository
        run: python3 tools/check_repo.py
      - name: Check website release version and assets
        run: python3 tools/build_site.py
      - name: Test validation tooling
        run: python3 -m unittest discover -s tools/tests -v

  native:
    needs: identity
    name: Native shell (${{ matrix.compiler }}, ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++-13
            preset: dev
          - compiler: clang++-18
            preset: release
          - compiler: clang++-18
            preset: asan
    env:
      CXX: ${{ matrix.compiler }}
      VERSION_SUFFIX: ${{ needs.identity.outputs.suffix }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 clang-18 ninja-build python3-venv \
            libarchive-dev zlib1g-dev libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0 xvfb xauth
      - name: Install pinned development tools and Qt
        run: |
          python3 -m venv build/tooling
          build/tooling/bin/python -m pip install -r tools/requirements-dev.txt
          build/tooling/bin/python -m aqt install-qt linux desktop 6.12.0 linux_gcc_64 \
            --outputdir build/qt --modules qtimageformats --archives icu qtbase qtdeclarative qtsvg qttools qtwayland qtimageformats
          echo "$GITHUB_WORKSPACE/build/tooling/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/build/qt/6.12.0/gcc_64" >> "$GITHUB_ENV"
      - name: Configure and build
        run: |
          cmake --preset "${{ matrix.preset }}" -DOPENPAINT_VERSION_SUFFIX="$VERSION_SUFFIX"
          cmake --build --preset "${{ matrix.preset }}" --parallel 2
      - name: Check C++ and QML
        run: cmake --build --preset "${{ matrix.preset }}" --target format-check qml-lint
      - name: Test application shell
        run: ctest --preset "${{ matrix.preset }}"
      - name: Test isolated X11 input and scaling
        if: matrix.preset == 'dev'
        run: |
          ldd "$CMAKE_PREFIX_PATH/plugins/platforms/libqxcb.so"
          for scale in 1 1.25 1.5 2; do
            QT_SCALE_FACTOR="$scale" xvfb-run -a -s '-screen 0 3200x2000x24 -nolisten tcp' \
              env QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software ./build/dev/openpaint_shell_tests
          done

  appimage:
    needs: identity
    name: ${{ matrix.kind == 'portable' && 'AppImage package and inventory' || 'Ubuntu package and inventory' }}
    strategy:
      fail-fast: false
      matrix:
        kind: [portable, system]
    env:
      CXX: g++-13
      VERSION_SUFFIX: ${{ needs.identity.outputs.suffix }}
    runs-on: ubuntu-24.04
    container:
      image: ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
    timeout-minutes: 25
    steps:
      - name: Install Git before checkout
        run: |
          apt-get update
          apt-get install -y git ca-certificates
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install package prerequisites and source indexes
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          # Bring inherited libraries to versions with matching source indexes.
          DEBIAN_FRONTEND=noninteractive apt-get upgrade -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y g++-13 cmake ninja-build python3-venv libarchive-dev zlib1g-dev \
            ca-certificates file git dpkg-dev binutils \
            libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0 desktop-file-utils appstream \
            libdbus-1-3 libegl1 libfontconfig1 libfreetype6 libglib2.0-0t64 \
            libx11-6 libxext6 libxrender1 libwayland-client0 libwayland-egl1 \
            libwayland-cursor0 libvulkan1 libdrm2
      - name: Install pinned Qt
        run: |
          python3 -m venv build/tooling
          build/tooling/bin/python -m pip install -r tools/requirements-dev.txt
          build/tooling/bin/python -m aqt install-qt linux desktop 6.12.0 linux_gcc_64 \
            --outputdir build/qt --modules qtimageformats --archives icu qtbase qtdeclarative qtsvg qttools qtwayland qtimageformats
      - name: Build portable package, source bundle and inventory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --verify HEAD
          desktop-file-validate packaging/io.github.AfshinKI.OpenPaint.desktop
          appstreamcli validate --no-net packaging/io.github.AfshinKI.OpenPaint.metainfo.xml
          python3 tools/package_appimage.py --qt build/qt/6.12.0/gcc_64 --collect-system-sources --kind "${{ matrix.kind }}" --suffix "$VERSION_SUFFIX"
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 build/appimage/*.AppImage --version
          if test '${{ matrix.kind }}' = portable; then
            mkdir -p build/portable-smoke
            tar -xzf build/appimage/public/*-linux-x86_64.tar.gz -C build/portable-smoke
            QT_QPA_PLATFORM=offscreen build/portable-smoke/*/openpaint --version
          fi
          cd build/appimage/public
          sha256sum -c SHA256SUMS
      - name: Retain review artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.kind == 'system' && 'deb-development-x86_64' || 'appimage-development-x86_64' }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/appimage/public/*
            build/appimage/*.AppImage
            build/appimage/*.json
            build/appimage/*.tar
            build/appimage/SHA256SUMS

  deb-install:
    name: Ubuntu package lifecycle
    permissions:
      contents: read
      actions: read
    needs: appimage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download '${{ github.run_id }}' --name deb-development-x86_64 --dir artifacts
      - name: Install, replace and remove package
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          bash tools/test_deb_install.sh artifacts/public/*.deb

  flatpak:
    needs: identity
    env:
      VERSION_SUFFIX: ${{ needs.identity.outputs.suffix }}
    name: Flatpak bundle and sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Flatpak build tools and reviewed runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          python3 - <<'PY'
          import json, subprocess
          lock = json.load(open('packaging/flatpak-runtime.json'))
          for kind in ('runtime', 'sdk'):
              entry = lock[kind]
              ref = f"{entry['id']}/{lock['architecture']}/{lock['branch']}"
              subprocess.run(['flatpak', 'install', '--user', '-y', '--noninteractive', 'flathub', ref], check=True)
              subprocess.run(['flatpak', 'update', '--user', '-y', '--noninteractive', '--commit=' + entry['commit'], ref], check=True)
          PY
      - name: Build and inspect sandboxed package
        run: |
          python3 tools/package_flatpak.py --suffix "$VERSION_SUFFIX"
          flatpak install --user -y --noninteractive build/flatpak/*.flatpak
          flatpak run --env=QT_QPA_PLATFORM=offscreen io.github.AfshinKI.OpenPaint --version
          cd build/flatpak
          sha256sum -c SHA256SUMS
      - name: Retain review artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-development-x86_64
          retention-days: 7
          if-no-files-found: error
          path: |
            build/flatpak/*.flatpak
            build/flatpak/*.json
            build/flatpak/openpaint-source.tar
            build/flatpak/SHA256SUMS

  publish:
    name: Publish tested stable release
    if: needs.identity.outputs.publish == 'true'
    needs: [identity, repository, native, appimage, deb-install, flatpak, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: stable-release-${{ needs.identity.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      SOURCE_SHA: ${{ github.sha }}
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's tested packages
        run: |
          gh run download "$RUN_ID" --name appimage-development-x86_64 --dir downloads/portable
          gh run download "$RUN_ID" --name deb-development-x86_64 --dir downloads/deb
          gh run download "$RUN_ID" --name flatpak-development-x86_64 --dir artifacts/flatpak
          gh run download "$RUN_ID" --name macos-development-arm64 --dir artifacts/macos
          mkdir -p artifacts
          mv downloads/portable/public artifacts/portable
          mv downloads/deb/public artifacts/deb
      - name: Verify and consolidate release assets
        run: python3 tools/release.py stage --artifacts artifacts --destination release --version "$RELEASE_VERSION" --commit "$SOURCE_SHA"
      - name: Publish immutable stable assets
        shell: bash
        run: bash tools/publish_release.sh
